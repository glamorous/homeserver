# No web UI here is published on the host: NPM reaches each one by container
# name over the shared network, behind forward auth, so the LAN cannot bypass
# the login. If authentik is down, switch forward auth off for that host in NPM.
services:
    prowlarr:
        image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls159
        container_name: prowlarr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${BASE_DIR}/prowlarr/config:/config
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9696/ping || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - homeserver

    radarr:
        image: lscr.io/linuxserver/radarr:6.3.0.10514-ls316
        container_name: radarr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${BASE_DIR}/radarr/config:/config
            # Same container path as in transmission, otherwise the path it
            # reports for a finished download does not exist here.
            - ${MEDIA_DOWNLOADS_DIR}:/downloads
            - ${MEDIA_LIBRARY_DIR}:/media
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:7878/ping || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - homeserver

    sonarr:
        image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls324
        container_name: sonarr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${BASE_DIR}/sonarr/config:/config
            - ${MEDIA_DOWNLOADS_DIR}:/downloads
            - ${MEDIA_LIBRARY_DIR}:/media
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8989/ping || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - homeserver

    bazarr:
        image: lscr.io/linuxserver/bazarr:v1.6.1-ls364
        container_name: bazarr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${BASE_DIR}/bazarr/config:/config
            # Same container path as in radarr and sonarr, so their file paths
            # need no mapping.
            - ${MEDIA_LIBRARY_DIR}:/media
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:6767/api/system/ping || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - homeserver

    transmission:
        image: lscr.io/linuxserver/transmission:4.1.3-r0-ls361
        container_name: transmission
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
            - PEERPORT=${TRANSMISSION_PEER_PORT}
        ports:
            - "${TRANSMISSION_PEER_PORT}:${TRANSMISSION_PEER_PORT}"
            - "${TRANSMISSION_PEER_PORT}:${TRANSMISSION_PEER_PORT}/udp"
        volumes:
            - ${BASE_DIR}/transmission/config:/config
            # Keep this on the server and outside BASE_DIR, or the backup copies
            # half-finished downloads. The image's defaults already use
            # /downloads/incomplete and /downloads/complete.
            - ${MEDIA_DOWNLOADS_DIR}:/downloads
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 9091 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - homeserver

    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
        container_name: flaresolverr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - LOG_LEVEL=info
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8191/health || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - homeserver

    seerr:
        image: ghcr.io/seerr-team/seerr:v3
        container_name: seerr
        init: true
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - LOG_LEVEL=info
        volumes:
            - ${BASE_DIR}/seerr/config:/app/config
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        security_opt:
            - no-new-privileges
        cap_drop:
            - ALL
        networks:
            - homeserver

    curator:
        image: python:3.12-alpine
        container_name: media-curator
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            # Keep looking for a better release until both windows have passed;
            # the later of the two wins.
            - KEEP_DAYS_AFTER_ADD=${CURATOR_DAYS_AFTER_ADD}
            - KEEP_DAYS_AFTER_RELEASE=${CURATOR_DAYS_AFTER_RELEASE}
            # When to look for everything still missing: ISO weekday, hour.
            - MISSING_SEARCH_WEEKDAY=${CURATOR_MISSING_SEARCH_WEEKDAY}
            - MISSING_SEARCH_HOUR=${CURATOR_MISSING_SEARCH_HOUR}
        # Reads the API keys where the other two already keep them, so this
        # service needs no secrets of its own.
        volumes:
            - ${BASE_DIR}/radarr/config/config.xml:/keys/radarr.xml:ro
            - ${BASE_DIR}/sonarr/config/config.xml:/keys/sonarr.xml:ro
        command:
            - sh
            - -c
            - |
              cat > /curator.py <<'PY'
              import datetime as dt, json, os, re, sys, urllib.request

              NOW = dt.datetime.now(dt.timezone.utc)
              LOCAL = dt.datetime.now()
              AFTER_ADD = dt.timedelta(days=int(os.environ["KEEP_DAYS_AFTER_ADD"]))
              AFTER_RELEASE = dt.timedelta(days=int(os.environ["KEEP_DAYS_AFTER_RELEASE"]))

              def key(path):
                  return re.search(r"<ApiKey>(.+?)</ApiKey>", open(path).read()).group(1)

              def api(base, api_key, path, method="GET", body=None):
                  request = urllib.request.Request(
                      base + path, method=method,
                      data=json.dumps(body).encode() if body else None,
                      headers={"X-Api-Key": api_key, "Content-Type": "application/json"})
                  with urllib.request.urlopen(request, timeout=120) as response:
                      raw = response.read()
                  return json.loads(raw) if raw else None

              def moment(value):
                  return dt.datetime.fromisoformat(value.replace("Z", "+00:00")) if value else None

              def oversized():
                  # The size limit is checked against what the indexer reported,
                  # and some report a fraction of the real torrent. The client
                  # knows the real size once the download starts. What only got
                  # past the limit that way is removed, blocklisted and searched
                  # for again; a release picked by hand that was honestly too big
                  # is left alone.
                  for name, base in (("radarr", "http://radarr:7878/api/v3"),
                                     ("sonarr", "http://sonarr:8989/api/v3")):
                      api_key = key(f"/keys/{name}.xml")
                      limits = {d["quality"]["id"]: d.get("maxSize")
                                for d in api(base, api_key, "/qualitydefinition")}
                      downloads = {}
                      for record in api(base, api_key, "/queue?pageSize=1000&includeMovie=true"
                                                       "&includeEpisode=true&includeSeries=true")["records"]:
                          if record.get("downloadId"):
                              downloads.setdefault(record["downloadId"], []).append(record)
                      # A season pack is one download with a record per episode.
                      for download, records in downloads.items():
                          first = records[0]
                          limit = limits.get(first["quality"]["quality"]["id"])
                          minutes = sum((r.get("movie") or r.get("episode") or {}).get("runtime")
                                        or (r.get("series") or {}).get("runtime") or 0 for r in records)
                          if not (limit and minutes and first.get("size")):
                              continue
                          allowed = limit * minutes * 1024 * 1024
                          if first["size"] <= allowed:
                              continue
                          grabs = api(base, api_key, f"/history?downloadId={download}&pageSize=50")["records"]
                          reported = max((int(g["data"].get("size") or 0) for g in grabs
                                          if g["eventType"] == "grabbed"), default=0)
                          if not reported or reported > allowed:
                              continue
                          api(base, api_key, f"/queue/{first['id']}?removeFromClient=true&blocklist=true", "DELETE")
                          print(f"{name}: {first['title']} is {first['size'] / 1e9:.1f} GB, reported as "
                                f"{reported / 1e9:.1f} GB, limit {allowed / 1e9:.1f} GB; blocklisted", flush=True)

              if sys.argv[1:] == ["queue"]:
                  oversized()
                  sys.exit()

              def done_looking(added, released):
                  deadlines = [d for d in (added and added + AFTER_ADD,
                                           released and released + AFTER_RELEASE) if d]
                  return bool(deadlines) and NOW > max(deadlines)

              # Audio the Apple TV passes to the soundbar as it is. AAC plays
              # too, but a better release is worth waiting for until the window
              # closes.
              PASSTHROUGH = ("AC3", "EAC3")
              LANGUAGE_CODES = {
                  "English": {"eng", "en"}, "Dutch": {"nld", "dut", "nl"},
                  "French": {"fre", "fra", "fr"}, "German": {"ger", "deu", "de"},
                  "Spanish": {"spa", "es"}, "Norwegian": {"nor", "nob", "no"},
                  "Danish": {"dan", "da"}, "Swedish": {"swe", "sv"},
              }

              def targets(base, api_key):
                  # What a profile is really after is its cutoff: 4K asks for
                  # Atmos, and only a profile that takes remuxes accepts TrueHD.
                  aims = {}
                  for profile in api(base, api_key, "/qualityprofile"):
                      cutoff = next(item for item in profile["items"]
                                    if (item.get("id") or item.get("quality", {}).get("id")) == profile["cutoff"])
                      names = [q["quality"]["name"] for q in cutoff.get("items") or [cutoff]]
                      aims[profile["id"]] = {"uhd": any("2160p" in n for n in names),
                                             "remux": any("Remux" in n for n in names)}
                  return aims

              def settled(info, original, aim):
                  # Judged on what ffprobe found in the file, not on what the
                  # release name claimed.
                  if not info:
                      return False
                  width = int((info.get("resolution") or "0x0").split("x")[0] or 0)
                  codec = info.get("audioCodec") or ""
                  heard = {l for l in (info.get("audioLanguages") or "").split("/") if l and l != "und"}
                  expected = LANGUAGE_CODES.get((original or {}).get("name"))
                  if heard and expected and not heard & expected:
                      return False
                  if aim["uhd"]:
                      return (width >= 3500 and info.get("videoDynamicRange") == "HDR"
                              and codec.endswith("Atmos") and (aim["remux"] or codec.startswith("EAC3")))
                  return width >= 1800 and (info.get("audioChannels") or 0) >= 5.1 and codec.split(" ")[0] in PASSTHROUGH

              radarr, radarr_key = "http://radarr:7878/api/v3", key("/keys/radarr.xml")
              aims = targets(radarr, radarr_key)
              movies, early = [], 0
              for m in api(radarr, radarr_key, "/movie"):
                  if not (m["monitored"] and m.get("hasFile")):
                      continue
                  if settled((m.get("movieFile") or {}).get("mediaInfo"), m.get("originalLanguage"), aims[m["qualityProfileId"]]):
                      early += 1
                  elif not done_looking(moment(m.get("added")),
                                        max([d for d in (moment(m.get("digitalRelease")),
                                                         moment(m.get("physicalRelease")),
                                                         moment(m.get("inCinemas"))) if d], default=None)):
                      continue
                  movies.append(m["id"])
              if movies:
                  api(radarr, radarr_key, "/movie/editor", "PUT",
                      {"movieIds": movies, "monitored": False})
              print(f"films: {len(movies)} no longer monitored, {early} of them on their file", flush=True)

              sonarr, sonarr_key = "http://sonarr:8989/api/v3", key("/keys/sonarr.xml")
              aims = targets(sonarr, sonarr_key)
              episodes, early = [], 0
              for series in api(sonarr, sonarr_key, "/series"):
                  for episode in api(sonarr, sonarr_key,
                                     f"/episode?seriesId={series['id']}&includeEpisodeFile=true"):
                      if not (episode["monitored"] and episode.get("hasFile")):
                          continue
                      file = episode.get("episodeFile") or {}
                      if settled(file.get("mediaInfo"), series.get("originalLanguage"), aims[series["qualityProfileId"]]):
                          early += 1
                      elif not done_looking(moment(file.get("dateAdded")), moment(episode.get("airDateUtc"))):
                          continue
                      episodes.append(episode["id"])
              if episodes:
                  api(sonarr, sonarr_key, "/episode/monitor", "PUT",
                      {"episodeIds": episodes, "monitored": False})
              print(f"episodes: {len(episodes)} no longer monitored, {early} of them on their file", flush=True)

              # Feeds only carry what was just posted, so an old episode that is
              # still missing, or an older release better than the file at hand,
              # is never found unless someone searches for it. What is still
              # monitored is small, because the curator lets go of the rest above.
              # Once a week is enough, and keeps indexers from seeing it as
              # hammering. Only the run at the top of the hour counts, so a
              # retry after a failure cannot search twice.
              if (LOCAL.isoweekday() == int(os.environ["MISSING_SEARCH_WEEKDAY"])
                      and LOCAL.hour == int(os.environ["MISSING_SEARCH_HOUR"]) and LOCAL.minute < 10):
                  for name in ("MissingMoviesSearch", "CutoffUnmetMoviesSearch"):
                      api(radarr, radarr_key, "/command", "POST",
                          {"name": name, "filterKey": "monitored", "filterValue": "true"})
                  for name in ("MissingEpisodeSearch", "CutoffUnmetEpisodeSearch"):
                      api(sonarr, sonarr_key, "/command", "POST", {"name": name, "monitored": True})
                  print("weekly: searched for what is missing or below the cutoff", flush=True)
              PY
              # Hourly and on the hour, so a file that is already good enough is
              # let go before the next feed cycle grabs an upgrade it does not
              # need, and the weekly search lands at the hour it was set for.
              # The queue every five minutes, so an oversized download is caught
              # while it has barely started.
              ( while true; do
                  python3 /curator.py queue
                  sleep $$((300 - $$(date +%s) % 300))
                done ) &
              while true; do
                python3 /curator.py && sleep $$((3600 - $$(date +%s) % 3600)) || sleep 900
              done
        # Waits for both to answer, otherwise the first run lands before they
        # are up and the next one is an hour away.
        depends_on:
            radarr:
                condition: service_healthy
            sonarr:
                condition: service_healthy
        networks:
            - homeserver

    kometa:
        image: lscr.io/linuxserver/kometa:v2.4.8-ls117
        container_name: kometa
        restart: unless-stopped
        # Plex runs natively on the host, not in a container.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
            - KOMETA_TIMES=${KOMETA_TIMES:-06:00}
            # config.yml refers to these as <<plextoken>> and <<tmdbkey>>; the
            # names after the prefix must not contain underscores.
            - KOMETA_PLEXTOKEN=${KOMETA_PLEX_TOKEN}
            - KOMETA_TMDBKEY=${KOMETA_TMDB_KEY}
        # The image halts at start-up until /config/config.yml exists.
        volumes:
            - ${BASE_DIR}/kometa/config:/config
        networks:
            - homeserver

networks:
    homeserver:
        external: true
