# No web UI here is published on the host: NPM reaches each one by container
# name over the shared network, behind forward auth, so the LAN cannot bypass
# the login. If authentik is down, switch forward auth off for that host in NPM.
services:
    prowlarr:
        image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls159
        container_name: prowlarr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${BASE_DIR}/prowlarr/config:/config
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9696/ping || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - homeserver

    radarr:
        image: lscr.io/linuxserver/radarr:6.3.0.10514-ls316
        container_name: radarr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${BASE_DIR}/radarr/config:/config
            # Same container path as in transmission, otherwise the path it
            # reports for a finished download does not exist here.
            - ${MEDIA_DOWNLOADS_DIR}:/downloads
            - ${MEDIA_LIBRARY_DIR}:/media
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:7878/ping || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - homeserver

    sonarr:
        image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls324
        container_name: sonarr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${BASE_DIR}/sonarr/config:/config
            - ${MEDIA_DOWNLOADS_DIR}:/downloads
            - ${MEDIA_LIBRARY_DIR}:/media
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8989/ping || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - homeserver

    bazarr:
        image: lscr.io/linuxserver/bazarr:v1.6.1-ls364
        container_name: bazarr
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${BASE_DIR}/bazarr/config:/config
            # Same container path as in radarr and sonarr, so their file paths
            # need no mapping.
            - ${MEDIA_LIBRARY_DIR}:/media
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:6767/api/system/ping || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - homeserver

    transmission:
        image: lscr.io/linuxserver/transmission:4.1.3-r0-ls361
        container_name: transmission
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
            - PEERPORT=${TRANSMISSION_PEER_PORT}
        ports:
            - "${TRANSMISSION_PEER_PORT}:${TRANSMISSION_PEER_PORT}"
            - "${TRANSMISSION_PEER_PORT}:${TRANSMISSION_PEER_PORT}/udp"
        volumes:
            - ${BASE_DIR}/transmission/config:/config
            # Keep this on the server and outside BASE_DIR, or the backup copies
            # half-finished downloads. The image's defaults already use
            # /downloads/incomplete and /downloads/complete.
            - ${MEDIA_DOWNLOADS_DIR}:/downloads
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 9091 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - homeserver

    seerr:
        image: ghcr.io/seerr-team/seerr:v3
        container_name: seerr
        init: true
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - LOG_LEVEL=info
        volumes:
            - ${BASE_DIR}/seerr/config:/app/config
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        security_opt:
            - no-new-privileges
        cap_drop:
            - ALL
        networks:
            - homeserver

    kometa:
        image: lscr.io/linuxserver/kometa:v2.4.8-ls117
        container_name: kometa
        restart: unless-stopped
        # Plex runs natively on the host, not in a container.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
            - KOMETA_TIMES=${KOMETA_TIMES:-06:00}
            # config.yml refers to these as <<plextoken>> and <<tmdbkey>>; the
            # names after the prefix must not contain underscores.
            - KOMETA_PLEXTOKEN=${KOMETA_PLEX_TOKEN}
            - KOMETA_TMDBKEY=${KOMETA_TMDB_KEY}
        # The image halts at start-up until /config/config.yml exists.
        volumes:
            - ${BASE_DIR}/kometa/config:/config
        networks:
            - homeserver

networks:
    homeserver:
        external: true
