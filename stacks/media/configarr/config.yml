# Managed by this repo. Edit here, commit, redeploy -> Configarr syncs.
# reset_unmatched_scores is OFF everywhere: Configarr only sets the three
# language formats below and leaves every other score (Atmos, Dolby *, Surround,
# Lossless, Stereo, 2160p, Dolby Vision, HDR10, Season Pack) exactly as the apps
# already have them.
#
# min_format_score is deliberately NOT set here: it stays 0 in both apps.
# Configarr only manages a profile's score floor when it also manages that
# profile's qualities, which we do not hand it (that would overwrite the quality
# groups). At min 0 the MULTi -1 is a tiebreaker for any release that has a
# recognised audio tag (those score positive); only a MULTi release with no
# audio tag at all would fall to -1 and be rejected, which is an acceptable loss.

customFormatDefinitions:
  - trash_id: local-multi
    name: MULTi
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: MULTi / Dual Audio
        implementation: ReleaseTitleSpecification
        negate: false
        required: true
        fields:
          value: "(?i)\\bmulti\\b|\\bdual[ ._-]?audio\\b"

  - trash_id: local-nl-vlaams
    name: Dutch/Flemish Audio
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: Dutch
        implementation: LanguageSpecification
        negate: false
        required: false
        fields:
          value: 7
      - name: Flemish
        implementation: LanguageSpecification
        negate: false
        required: false
        fields:
          value: 19
      - name: NL/Vlaams tags
        implementation: ReleaseTitleSpecification
        negate: false
        required: false
        fields:
          value: "(?i)\\b(dutch|flemish|vlaams)\\b"

  # Already exists in both apps; redefined identically so its score is managed
  # here too. Raised to -2000 (was -1000) so that even a pure NL/Vlaams dub with
  # top audio stays below the floor and is rejected.
  - trash_id: local-not-original
    name: Andere taal dan origineel
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: taal
        implementation: LanguageSpecification
        negate: true
        required: true
        fields:
          value: -2

radarr:
  films:
    base_url: http://radarr:7878
    api_key: !env RADARR_API_KEY
    quality_profiles:
      - name: Films 1080p
        reset_unmatched_scores:
          enabled: false
      - name: Films 4K Atmos
        reset_unmatched_scores:
          enabled: false
      - name: Films 4K hoge kwaliteit
        reset_unmatched_scores:
          enabled: false
    custom_formats:
      - trash_ids: [local-multi]
        assign_scores_to:
          - name: Films 1080p
            score: -1
          - name: Films 4K Atmos
            score: -1
          - name: Films 4K hoge kwaliteit
            score: -1
      - trash_ids: [local-nl-vlaams]
        assign_scores_to:
          - name: Films 1080p
            score: 600
          - name: Films 4K Atmos
            score: 600
          - name: Films 4K hoge kwaliteit
            score: 600
      - trash_ids: [local-not-original]
        assign_scores_to:
          - name: Films 1080p
            score: -2000
          - name: Films 4K Atmos
            score: -2000
          - name: Films 4K hoge kwaliteit
            score: -2000

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: !env SONARR_API_KEY
    quality_profiles:
      - name: Series 1080p
        reset_unmatched_scores:
          enabled: false
      - name: Series 4K Atmos
        reset_unmatched_scores:
          enabled: false
    custom_formats:
      - trash_ids: [local-multi]
        assign_scores_to:
          - name: Series 1080p
            score: -1
          - name: Series 4K Atmos
            score: -1
      - trash_ids: [local-nl-vlaams]
        assign_scores_to:
          - name: Series 1080p
            score: 600
          - name: Series 4K Atmos
            score: 600
      - trash_ids: [local-not-original]
        assign_scores_to:
          - name: Series 1080p
            score: -2000
          - name: Series 4K Atmos
            score: -2000
