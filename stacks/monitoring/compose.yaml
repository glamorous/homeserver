services:
    uptime-kuma:
        image: louislam/uptime-kuma:2
        container_name: uptime-kuma
        restart: unless-stopped
        ports:
            - "${UPTIME_KUMA_PORT}:3001"
        volumes:
            - ${BASE_DIR}/uptime-kuma/app/data:/app/data
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - homeserver

    speedtest-tracker:
        image: lscr.io/linuxserver/speedtest-tracker:latest
        container_name: speedtest-tracker
        restart: unless-stopped
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - APP_KEY=${SPEEDTEST_TRACKER_APP_KEY}
            - ADMIN_NAME=admin
            - ADMIN_EMAIL=${ADMIN_EMAIL}
            - ADMIN_PASSWORD=${SPEEDTEST_TRACKER_PASSWORD}
            - APP_URL=${SPEEDTEST_TRACKER_URL}
            - DB_CONNECTION=sqlite
            - SPEEDTEST_SCHEDULE=${SPEEDTEST_TRACKER_SCHEDULE}
            - SPEEDTEST_SERVERS=${SPEEDTEST_TRACKER_SERVERS}
            - DISPLAY_TIMEZONE=${TZ}
        volumes:
            - ${BASE_DIR}/speedtest-tracker/config:/config
        ports:
            - "${SPEEDTEST_TRACKER_PORT_HTTP}:80"
            - "${SPEEDTEST_TRACKER_PORT_HTTPS}:443"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:80/api/healthcheck || exit 1"]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 120s
        networks:
            - homeserver

    diun:
        image: crazymax/diun:4
        container_name: diun
        # Diun puts this name in every notification. Without it the container id
        # is reported, which says nothing and changes on every recreation.
        hostname: ${HOST_NAME:-homeserver}
        restart: unless-stopped
        command: serve
        environment:
            - TZ=${TZ}
            - DIUN_WATCH_WORKERS=20
            - DIUN_WATCH_SCHEDULE=${DIUN_SCHEDULER}
            - DIUN_WATCH_JITTER=30s
            - DIUN_PROVIDERS_DOCKER=true
            - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
            - DIUN_NOTIF_TELEGRAM_TOKEN=${DIUN_TELEGRAM_TOKEN}
            - DIUN_NOTIF_TELEGRAM_CHATIDS=${DIUN_TELEGRAM_CHATID}
        volumes:
            - ${BASE_DIR}/diun/data:/data
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - homeserver

networks:
    homeserver:
        external: true
