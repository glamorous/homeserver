services:
    heimdall:
        image: linuxserver/heimdall:latest
        container_name: heimdall
        restart: unless-stopped
        ports:
            - "${HEIMDALL_PORT_HTTP}:80"
            - "${HEIMDALL_PORT_HTTPS}:443"
        volumes:
            - ${BASE_DIR}/heimdall/config:/config
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:80/ || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - homeserver

    node-red:
        image: nodered/node-red:4.1
        container_name: node-red
        restart: unless-stopped
        environment:
            - TZ=${TZ}
        ports:
            - "${NODE_RED_PORT}:1880"
        volumes:
            - ${BASE_DIR}/node-red/data:/data
        networks:
            - homeserver

    influxdb:
        image: influxdb:2
        container_name: influxdb
        restart: unless-stopped
        environment:
            - TZ=${TZ}
        ports:
            - "${INFLUXDB_PORT}:8086"
        volumes:
            - ${BASE_DIR}/influxdb/var/lib/influxdb2:/var/lib/influxdb2
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8086/health || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - homeserver

networks:
    homeserver:
        external: true
