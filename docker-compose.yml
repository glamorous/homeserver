version: '3'
services:
    ofelia:
        image: mcuadros/ofelia:latest
        container_name: ofelia
        command: daemon --docker
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
    heimdall:
        image: linuxserver/heimdall:latest
        container_name: heimdall
        restart: unless-stopped
        ports:
            - "${HEIMDALL_PORT_HTTP}:80"
            - "${HEIMDALL_PORT_HTTPS}:443"
        volumes:
            - ${BASE_DIR}/heimdall/config:/config
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
    pihole:
        image: pihole/pihole:latest
        container_name: pihole
        restart: unless-stopped
        ports:
            - "53:53/tcp"
            - "53:53/udp"
            - "${PIHOLE_PORT_HTTP}:80"
            - "${PIHOLE_PORT_HTTPS}:443"
        environment:
            - TZ=${TZ}
            - FTLCONF_webserver_api_password=${PIHOLE_ADMIN_PASSWORD}
            - FTLCONF_dns_listeningMode=single
        volumes:
            - ${BASE_DIR}/pihole/etc/pihole:/etc/pihole
            - ${BASE_DIR}/pihole/etc/dnsmasq.d:/etc/dnsmasq.d
        dns:
            - 1.1.1.2
            - 1.1.1.1
        cap_add:
            - SYS_NICE
            - SYS_TIME
    node-red:
        image: nodered/node-red:latest
        container_name: node-red
        restart: unless-stopped
        environment:
            - TZ=${TZ}
        ports:
            - "${NODE_RED_PORT}:1880"
        volumes:
            - ${BASE_DIR}/node-red/data:/data
    influxdb:
        image: influxdb:latest
        container_name: influxdb
        restart: unless-stopped
        environment:
            - TZ=${TZ}
        ports:
            - "${INFLUXDB_PORT}:8086"
        volumes:
            - ${BASE_DIR}/influxdb/var/lib/influxdb2:/var/lib/influxdb2
    duckdns:
        image: lscr.io/linuxserver/duckdns:latest
        container_name: duckdns
        restart: unless-stopped
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
            - TOKEN=${DUCKDNS_TOKEN}
            - UPDATE_IP=ipv4
            - LOG_FILE=false
        volumes:
            - ${BASE_DIR}/duckdns/config:/config
    diun:
        image: crazymax/diun:latest
        container_name: diun
        restart: unless-stopped
        command: serve
        environment:
            - TZ=${TZ}
            - DIUN_WATCH_WORKERS=20
            - DIUN_WATCH_SCHEDULE=${DIUN_SCHEDULER}
            - DIUN_WATCH_JITTER=30s
            - DIUN_PROVIDERS_DOCKER=true
            - DIUN_NOTIF_TELEGRAM_TOKEN=${DIUN_TELEGRAM_TOKEN}
            - DIUN_NOTIF_TELEGRAM_CHATIDS=${DIUN_TELEGRAM_CHATID}
        volumes:
            - ${BASE_DIR}/diun/data:/data"
            - /var/run/docker.sock:/var/run/docker.sock
        labels:
            - "diun.enable=true"
    nginx-proxy-manager:
        image: 'jc21/nginx-proxy-manager:latest'
        container_name: nginx-proxy-manager
        restart: unless-stopped
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
        ports:
            - "${NGINX_PROXY_MANAGER_PORT_HTTP}:80"
            - "${NGINX_PROXY_MANAGER_PORT_ADMIN}:81"
            - "${NGINX_PROXY_MANAGER_PORT_HTTPS}:443"
        volumes:
            - ${BASE_DIR}/nginx-proxy-manager/data:/data
            - ${BASE_DIR}/nginx-proxy-manager/etc/letsencrypt:/etc/letsencrypt
        healthcheck:
            test: [ "CMD", "/usr/bin/check-health" ]
            interval: 10s
            timeout: 3s
    uptime-kuma:
        image: louislam/uptime-kuma:2
        container_name: uptime-kuma
        restart: unless-stopped
        volumes:
            - ${BASE_DIR}/uptime-kuma/app/data:/app/data
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - "${UPTIME_KUMA_PORT}:3001"
    speedtest-tracker:
        image: lscr.io/linuxserver/speedtest-tracker:latest
        container_name: speedtest-tracker
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - APP_KEY=${SPEEDTEST_TRACKER_APP_KEY}
            - ADMIN_NAME=admin
            - ADMIN_EMAIL=${ADMIN_EMAIL}
            - ADMIN_PASSWORD=${SPEEDTEST_TRACKER_PASSWORD}
            - APP_URL=${SPEEDTEST_TRACKER_URL}
            - DB_CONNECTION=sqlite
            - SPEEDTEST_SCHEDULE=${SPEEDTEST_TRACKER_SCHEDULE}
            - SPEEDTEST_SERVERS=${SPEEDTEST_TRACKER_SERVERS}
            - DISPLAY_TIMEZONE=${TZ}
        volumes:
            - ${BASE_DIR}/speedtest-tracker/config:/config
        ports:
            - "${SPEEDTEST_TRACKER_PORT_HTTP}:80"
            - "${SPEEDTEST_TRACKER_PORT_HTTPS}:443"
        restart: unless-stopped
